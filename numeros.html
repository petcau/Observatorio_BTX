<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#024a60" />
    <link rel="icon" href="data:," />
    <meta name="description" content="Um retrato de quem faz ciência, tecnologia e inovação na Bahia." />
    <title>Ciência em números • Ciência na Bahia</title>
    <link rel="stylesheet" href="internal.css?v=20261103-btx6" />
    <script src="orientation.js?v=20261103-btx6"></script>
    <script src="app.js?v=20261103-btx6" defer></script>
    <script src="numeros-gallery.js?v=20261103-btx6" defer></script>
  </head>
  <body class="internal-page numbers-page" data-page="numeros">
    <main class="internal-shell numbers-shell">
      <nav class="top-row top-row--internal" aria-label="Navegação principal">
        <a class="institutional-brand" href="index.html" aria-label="Observatório de CT&amp;I da Bahia — início">
          <img class="institutional-brand__logo" src="assets/logo observatório sem texto.jpeg" alt="" width="72" height="72" />
          <p><strong>Observatório</strong><span>de CT&amp;I da Bahia</span></p>
          <img class="brand-btx brand-btx--home" src="assets/logo-btx.png" alt="BTX — Bahia Tech Experience 2026" onerror="this.remove()" />
        </a>
        <p class="top-title">CIÊNCIA <em>NA BAHIA</em></p>
        <img class="top-gov" src="assets/marca-do-lado-da-gente.png" alt="Governo da Bahia" onerror="this.remove()" />
      </nav>

      <header class="numbers-hero reveal-block">
        <h1>Ciência em números</h1>
        <p class="numbers-hero__lead">Um retrato visual de quem faz ciência, tecnologia e inovação na Bahia.</p>
      </header>

      <section class="numbers-gallery reveal-block" aria-label="Infográficos">
        <div class="numbers-gallery__header">
          <div class="numbers-gallery__album" aria-label="Outros infográficos">
            <button class="numbers-gallery__thumb is-active" type="button" aria-current="true"
              data-infographic-src="assets/infograficos/ciencia-delas-infografico-01.png"
              data-infographic-title="Panorama Ciência Delas"
              data-infographic-description="O infográfico principal reúne os dados essenciais em uma visualização única e amigável."
              data-infographic-alt="Infográfico Ciência Delas com indicadores sobre pesquisadoras, instituições, áreas, produção científica e tecnológica.">
              <img src="assets/infograficos/ciencia-delas-infografico-01.png" alt="" />
              <span>Panorama geral</span>
            </button>
            <button class="numbers-gallery__thumb" type="button"
              data-infographic-src="assets/infograficos/ciencia-delas-infografico-02.png"
              data-infographic-title="Produção e impacto"
              data-infographic-description="Indicadores visuais sobre produção científica, citações e circulação do conhecimento."
              data-infographic-alt="Infográfico Ciência Delas sobre produção científica, citações e indicadores de impacto.">
              <img src="assets/infograficos/ciencia-delas-infografico-02.png" alt="" />
              <span>Produção e impacto</span>
            </button>
            <button class="numbers-gallery__thumb" type="button"
              data-infographic-src="assets/infograficos/ciencia-delas-infografico-03.png"
              data-infographic-title="Instituições e áreas"
              data-infographic-description="Um recorte visual das instituições, áreas de atuação e distribuição das pesquisadoras."
              data-infographic-alt="Infográfico Ciência Delas sobre instituições, áreas de atuação e distribuição das pesquisadoras.">
              <img src="assets/infograficos/ciencia-delas-infografico-03.png" alt="" />
              <span>Instituições e áreas</span>
            </button>
            <button class="numbers-gallery__thumb" type="button"
              data-infographic-src="assets/infograficos/ciencia-delas-infografico-04.png"
              data-infographic-title="Panorama complementar"
              data-infographic-description="Mais indicadores visuais para ampliar a leitura dos dados do Ciência Delas."
              data-infographic-alt="Infográfico complementar Ciência Delas com indicadores sobre pesquisadoras e produção científica.">
              <img src="assets/infograficos/ciencia-delas-infografico-04.png" alt="" />
              <span>Panorama complementar</span>
            </button>
          </div>
        </div>

        <figure class="numbers-gallery__stage">
          <img data-gallery-image src="assets/infograficos/ciencia-delas-infografico-01.png" alt="Infográfico Ciência Delas com indicadores sobre pesquisadoras, instituições, áreas, produção científica e tecnológica." />
        </figure>
      </section>

      <footer class="numbers-footer">
        <div><strong>Observatório de CT&amp;I da Bahia</strong><span>Ciência na Bahia • BTX 2026</span></div>
        <div class="numbers-footer__logos" aria-label="Espaço para logos institucionais"></div>
      </footer>
    </main>
    <footer class="site-footer"><button class="screen-mode-button" type="button" data-screen-mode hidden>Tela</button><span>BTX 2026 • SECTI-BA</span></footer>
  </body>
</html>
